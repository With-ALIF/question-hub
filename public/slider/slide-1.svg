<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="1600" height="680" role="img" aria-label="Teal study-themed banner with books and floating shapes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#042f2e"/>
      <stop offset="0.52" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a5f3fc" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pageLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfeff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#99f6e4" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="pageRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecfeff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#99f6e4" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ccfbf1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ccfbf1" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.055"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#022c22" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1600" height="680" fill="url(#bg)"/>
  <rect width="1600" height="680" fill="url(#grid)"/>
  <circle cx="1260" cy="120" r="420" fill="url(#glow)"/>
  <circle cx="260" cy="580" r="360" fill="url(#glow2)"/>
  <circle cx="1350" cy="560" r="240" fill="#0e7490" opacity="0.35" filter="url(#blur)"/>

  <g stroke="#ccfbf1" fill="none">
    <circle cx="1280" cy="150" r="178" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle cx="1280" cy="150" r="126" stroke-opacity="0.12" stroke-width="1.5"/>
    <circle cx="1280" cy="150" r="72" stroke-opacity="0.1" stroke-width="1.5"/>
    <path d="M140 520 C 300 430 430 640 620 520 S 900 420 1050 540" stroke-opacity="0.14" stroke-width="1.5"/>
  </g>

  <text x="248" y="470" font-family="Georgia, 'Times New Roman', serif" font-size="420" font-weight="700" fill="#ecfeff" opacity="0.055">?</text>

  <g filter="url(#soft)">
    <path d="M806 352 C 886 312 956 314 1008 346 L1008 526 C 956 492 886 490 806 532 Z" fill="url(#pageLeft)" stroke="#ccfbf1" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M1210 352 C 1130 312 1060 314 1008 346 L1008 526 C 1060 492 1130 490 1210 532 Z" fill="url(#pageRight)" stroke="#ccfbf1" stroke-opacity="0.3" stroke-width="2"/>
    <path d="M1008 346 L1008 526" stroke="#ccfbf1" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <g stroke="url(#line)" stroke-width="8" stroke-linecap="round">
    <path d="M858 392 C 900 376 936 376 970 390"/>
    <path d="M858 428 C 900 412 936 412 970 426"/>
    <path d="M858 464 C 900 448 936 448 970 462"/>
    <path d="M858 500 C 892 488 922 488 950 498"/>
    <path d="M1046 390 C 1080 376 1116 376 1158 392"/>
    <path d="M1046 426 C 1080 412 1116 412 1158 428"/>
    <path d="M1046 462 C 1080 448 1116 448 1158 464"/>
    <path d="M1046 498 C 1074 488 1104 488 1130 498"/>
  </g>

  <g fill="#99f6e4">
    <circle cx="340" cy="196" r="7" opacity="0.7"/>
    <circle cx="430" cy="150" r="4" opacity="0.45"/>
    <circle cx="1380" cy="430" r="6" opacity="0.6"/>
    <circle cx="1450" cy="360" r="3" opacity="0.4"/>
  </g>
  <g stroke="#a5f3fc" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <path d="M382 250 h28 M396 236 v28"/>
    <path d="M700 130 h22 M711 119 v22"/>
    <path d="M1320 300 h20 M1330 290 v20"/>
  </g>

  <rect x="0" y="560" width="1600" height="120" fill="#042f2e" opacity="0.18"/>
</svg>
