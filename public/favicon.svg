<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="qh-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="qh-amber" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="qh-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="14" fill="url(#qh-bg)" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#2dd4bf" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Book Pages (Open Book Base) -->
  <g filter="url(#qh-shadow)">
    <path d="M32 48C25 44 16.5 44 10 46.5V26.5C16.5 24 25 24 32 28V48Z" fill="#f0fdfa" />
    <path d="M32 48C39 44 47.5 44 54 46.5V26.5C47.5 24 39 24 32 28V48Z" fill="#ccfbf1" />
    <path d="M32 28V48" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" />

    <!-- Question Mark Motif -->
    <path d="M27.5 19C27.5 15.5 29.5 13.5 32 13.5C34.5 13.5 36.5 15.5 36.5 18C36.5 20.2 35 21.8 33.2 23.5C32.3 24.5 32 25.8 32 27.5" 
          stroke="url(#qh-amber)" stroke-width="3.4" stroke-linecap="round" />
    <circle cx="32" cy="33" r="1.9" fill="url(#qh-amber)" />
  </g>

  <!-- Hub Nodes -->
  <circle cx="14" cy="17" r="1.8" fill="#fbbf24" />
  <circle cx="50" cy="17" r="1.8" fill="#2dd4bf" />
</svg>
